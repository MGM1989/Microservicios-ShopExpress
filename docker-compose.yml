services:
  mongodb-pedidos:
    image: mongo:7
    container_name: shopexpress-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pedidos
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dynamodb-catalogo-usuarios:
    image: amazon/dynamodb-local:2.5.4
    container_name: shopexpress-dynamo
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: shopexpress-dynamo-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-catalogo-usuarios:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    depends_on:
      - dynamodb-catalogo-usuarios
    restart: unless-stopped

volumes:
  mongo_data:
