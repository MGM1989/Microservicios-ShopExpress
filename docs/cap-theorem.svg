<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="cap-title cap-desc">
  <title id="cap-title">Teorema CAP</title>
  <desc id="cap-desc">Diagrama de Venn del teorema CAP. MongoDB se ubica en CP (consistencia y tolerancia a particiones). DynamoDB se ubica en AP (disponibilidad y tolerancia a particiones). Las bases CA asumen red estable.</desc>
  <rect width="1000" height="720" fill="#ffffff"/>

  <defs>
    <clipPath id="clip-c"><circle cx="500" cy="264" r="172"/></clipPath>
    <clipPath id="clip-p"><circle cx="382" cy="454" r="172"/></clipPath>
    <clipPath id="clip-a"><circle cx="618" cy="454" r="172"/></clipPath>
  </defs>

  <text x="500" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1a365d">Teorema CAP</text>
  <text x="500" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4a5568">Clasificación clásica simplificada de bases de datos</text>

  <circle cx="500" cy="264" r="172" fill="#f7fbff" stroke="#2c5282" stroke-width="2.5"/>
  <circle cx="382" cy="454" r="172" fill="#f7fbff" stroke="#2c5282" stroke-width="2.5"/>
  <circle cx="618" cy="454" r="172" fill="#f7fbff" stroke="#2c5282" stroke-width="2.5"/>

  <g clip-path="url(#clip-c)">
    <circle cx="382" cy="454" r="172" fill="#111111"/>
  </g>
  <g clip-path="url(#clip-c)">
    <circle cx="618" cy="454" r="172" fill="#111111"/>
  </g>
  <g clip-path="url(#clip-p)">
    <circle cx="618" cy="454" r="172" fill="#111111"/>
  </g>

  <circle cx="500" cy="264" r="172" fill="none" stroke="#2c5282" stroke-width="2.5"/>
  <circle cx="382" cy="454" r="172" fill="none" stroke="#2c5282" stroke-width="2.5"/>
  <circle cx="618" cy="454" r="172" fill="none" stroke="#2c5282" stroke-width="2.5"/>

  <text x="500" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1a202c">Consistency</text>
  <text x="318" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a202c">
    <tspan x="318" dy="0">Partition-</tspan>
    <tspan x="318" dy="20">Tolerance</tspan>
  </text>
  <text x="690" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a202c">Availability</text>

  <text x="118" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2c5282">CP</text>
  <text x="118" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">Redis</text>
  <rect x="48" y="214" width="140" height="28" rx="6" fill="#e6f4ef"/>
  <text x="118" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#00684a">MongoDB</text>
  <text x="118" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">HBase</text>

  <text x="882" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2c5282">CA</text>
  <text x="882" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">Redshift</text>
  <text x="882" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">SQL Server</text>
  <text x="882" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">MySQL</text>
  <text x="882" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">Vertica</text>
  <text x="882" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">SAP HANA</text>
  <text x="882" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">Neo4j</text>
  <text x="882" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">PostgreSQL</text>

  <text x="500" y="648" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2c5282">AP</text>
  <rect x="268" y="658" width="140" height="28" rx="6" fill="#e8f0fe"/>
  <text x="338" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2c5282">DynamoDB</text>
  <text x="500" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">Cassandra</text>
  <text x="662" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d3748">CouchDB</text>
</svg>
